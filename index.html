<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8"/>
<meta name="viewport" content="width=device-width,initial-scale=1.0,user-scalable=no"/>
<title>Block Blast — 1v1 vs AI</title>
<link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;600;700;800;900&display=swap" rel="stylesheet"/>
<style>
*,*::before,*::after{box-sizing:border-box;margin:0;padding:0}
:root{--bg:#0f0f13;--panel:#1a1a24;--cell:#252535;--cellStroke:#2e2e42;--text:#e2e2f0;--muted:#6e6e8a;--accent:#7c3aed;--p1:#f85149;--p2:#58a6ff;--green:#3fb950;--highlight:#f0c000}
body{background:var(--bg);color:var(--text);font-family:'DM Sans',system-ui,sans-serif;min-height:100vh;display:flex;flex-direction:column;align-items:center;overflow-x:hidden;-webkit-user-select:none;user-select:none}

/* Menu */
#menu{display:flex;flex-direction:column;align-items:center;justify-content:center;min-height:100vh;padding:24px;gap:12px}
#menu h1{font-size:44px;font-weight:900;letter-spacing:-2px;background:linear-gradient(135deg,#f43f5e,#7c3aed,#3b82f6);-webkit-background-clip:text;-webkit-text-fill-color:transparent}
.sub{color:var(--muted);font-size:15px;margin-bottom:16px}
.opt-label{color:var(--muted);font-size:12px;font-weight:600;text-transform:uppercase;letter-spacing:1px}
.opt-row{display:flex;gap:8px;width:100%;max-width:340px}
.opt-btn{flex:1;padding:12px 8px;border-radius:10px;cursor:pointer;font-family:inherit;border:2px solid #2e2e42;background:var(--panel);color:var(--text);font-size:14px;font-weight:700;transition:all .15s}
.opt-btn:hover{border-color:#555}
.opt-btn.sel{border-color:var(--accent);background:rgba(124,58,237,.1)}
.opt-btn.sel-y{border-color:var(--highlight);background:rgba(240,192,0,.08)}
.start-btn{margin-top:20px;padding:14px 48px;border-radius:14px;cursor:pointer;font-family:inherit;border:none;background:linear-gradient(135deg,#7c3aed,#3b82f6);color:#fff;font-size:17px;font-weight:800;letter-spacing:.5px;box-shadow:0 4px 20px rgba(124,58,237,.4);transition:transform .15s}
.start-btn:hover{transform:scale(1.03)}

/* Game */
#game{display:none;flex-direction:column;align-items:center;padding:10px 8px;width:100%}
#game.active{display:flex}
.topbar{display:flex;align-items:center;gap:12px;margin-bottom:8px;flex-wrap:wrap;justify-content:center}
.topbar h1{font-size:22px;font-weight:800;letter-spacing:-.5px}
.tag{font-size:12px;color:var(--muted);background:var(--panel);padding:3px 10px;border-radius:6px}
.sm-btn{padding:4px 12px;border-radius:6px;border:1px solid #2e2e42;background:var(--panel);color:var(--text);cursor:pointer;font-size:12px;font-family:inherit}
.sm-btn:hover{background:#2e2e42}

.boards{display:flex;gap:16px;flex-wrap:wrap;justify-content:center;align-items:flex-start}
.board-col{display:flex;flex-direction:column;align-items:center;gap:6px}
.board-header{display:flex;align-items:center;gap:8px}
.pdot{width:10px;height:10px;border-radius:50%}
.score-num{font-size:20px;font-weight:800}
.target-num{font-size:12px;color:var(--muted)}
.prog-bar{height:4px;border-radius:2px;background:#252535;overflow:hidden}
.prog-fill{height:100%;border-radius:2px;transition:width .3s ease}
.grid{display:grid;padding:6px;border-radius:12px;background:var(--panel);border:2px solid #2e2e42;transition:border-color .3s}
.grid.active-p{border-color:rgba(248,81,73,.35)}
.grid.active-ai{border-color:rgba(88,166,255,.35)}
.grid-cell{border-radius:5px;border:1px solid var(--cellStroke);background:var(--cell);transition:background .1s}
.grid-cell.filled{border-color:rgba(0,0,0,.2)}
.grid-cell.ghost-ok{background:rgba(255,255,255,.12)}
.grid-cell.ghost-bad{background:rgba(248,81,73,.15)}
.stuck-msg{text-align:center;font-size:12px;margin-top:4px;font-weight:600}

.tray{display:flex;gap:10px;margin-top:12px;padding:10px 16px;border-radius:14px;background:var(--panel);border:1px solid #2e2e42;align-items:center;flex-wrap:wrap;justify-content:center}
.tray-label{color:var(--muted);font-size:11px;font-weight:600;text-transform:uppercase;letter-spacing:1px;margin-right:4px}
.piece-box{padding:8px;border-radius:10px;cursor:pointer;border:2px solid transparent;background:rgba(255,255,255,.03);transition:all .15s}
.piece-box:hover{background:rgba(255,255,255,.06)}
.piece-box.sel{border-color:var(--highlight);background:rgba(240,192,0,.08)}
.piece-box.used{opacity:.2;cursor:default;border:2px dashed #2e2e42;background:rgba(255,255,255,.01)}
.piece-box.disabled{opacity:.4;cursor:default}
.piece-grid{display:grid;gap:2px}
.piece-cell{border-radius:3px}
.streak{color:var(--highlight);font-size:12px;font-weight:700;margin-left:8px}
.hint{color:var(--muted);font-size:12px;margin-top:8px}
.hint.active{color:var(--highlight);font-weight:600}

.banner{padding:10px 24px;border-radius:12px;margin-bottom:10px;font-size:20px;font-weight:800;display:flex;align-items:center;gap:12px;animation:winPulse 1.5s ease infinite}
.banner.win{background:rgba(63,185,80,.15);border:2px solid var(--green);color:var(--green)}
.banner.lose{background:rgba(248,81,73,.1);border:2px solid var(--p1);color:var(--p1)}
.banner button{padding:6px 16px;border-radius:8px;background:rgba(0,0,0,.2);cursor:pointer;font-size:13px;font-weight:700;font-family:inherit}
.banner.win button{border:1.5px solid var(--green);color:var(--green)}
.banner.lose button{border:1.5px solid var(--p1);color:var(--p1)}

@keyframes winPulse{0%,100%{transform:scale(1)}50%{transform:scale(1.03)}}
@keyframes scorePop{0%{transform:scale(1)}50%{transform:scale(1.12)}100%{transform:scale(1)}}
@keyframes think{0%{opacity:.3}50%{opacity:1}100%{opacity:.3}}
</style>
</head>
<body>

<!-- MENU -->
<div id="menu">
  <h1>Block Blast</h1>
  <p class="sub">1v1 vs AI — Race to the target score</p>
  <div style="display:flex;flex-direction:column;align-items:center;gap:8px;width:100%;max-width:340px">
    <span class="opt-label">Difficulty</span>
    <div class="opt-row" id="diff-row"></div>
  </div>
  <div style="display:flex;flex-direction:column;align-items:center;gap:8px;width:100%;max-width:340px;margin-top:8px">
    <span class="opt-label">Target Score</span>
    <div class="opt-row" id="target-row"></div>
  </div>
  <button class="start-btn" onclick="startGame()">Start Game</button>
</div>

<!-- GAME -->
<div id="game">
  <div class="topbar">
    <h1>Block Blast</h1>
    <span class="tag" id="game-tag"></span>
    <div style="display:flex;gap:6px">
      <button class="sm-btn" onclick="resetGame()">Restart</button>
      <button class="sm-btn" onclick="backToMenu()">Menu</button>
    </div>
  </div>
  <div id="winner-banner" style="display:none"></div>
  <div class="boards">
    <div class="board-col" id="player-col">
      <div class="board-header">
        <div class="pdot" style="background:var(--p1)"></div>
        <span style="font-size:14px;font-weight:700">You</span>
        <span class="score-num" style="color:var(--p1)" id="p-score">0</span>
        <span class="target-num" id="p-target">/ 500</span>
      </div>
      <div class="prog-bar" id="p-prog-bar"><div class="prog-fill" id="p-prog" style="background:var(--p1);width:0%"></div></div>
      <div class="grid" id="p-grid"></div>
      <div class="stuck-msg" id="p-stuck" style="display:none;color:var(--p1)">Stuck — waiting for new pieces...</div>
    </div>
    <div class="board-col" id="ai-col">
      <div class="board-header">
        <div class="pdot" style="background:var(--p2)"></div>
        <span style="font-size:14px;font-weight:700">AI</span>
        <span class="score-num" style="color:var(--p2)" id="ai-score">0</span>
        <span class="target-num" id="ai-target">/ 500</span>
      </div>
      <div class="prog-bar" id="ai-prog-bar"><div class="prog-fill" id="ai-prog" style="background:var(--p2);width:0%"></div></div>
      <div class="grid" id="ai-grid"></div>
      <div class="stuck-msg" id="ai-stuck" style="display:none;color:var(--p2)">AI stuck — waiting...</div>
    </div>
  </div>
  <div class="tray" id="tray"></div>
  <p class="hint" id="hint">Select a piece below, then click your grid to place it</p>
</div>

<script>
// ─── Pieces ───
const PIECES=[
  {name:"dot",cells:[[0,0]],color:"#f59e0b"},
  {name:"h2",cells:[[0,0],[0,1]],color:"#ef4444"},
  {name:"h3",cells:[[0,0],[0,1],[0,2]],color:"#3b82f6"},
  {name:"h4",cells:[[0,0],[0,1],[0,2],[0,3]],color:"#8b5cf6"},
  {name:"h5",cells:[[0,0],[0,1],[0,2],[0,3],[0,4]],color:"#ec4899"},
  {name:"v2",cells:[[0,0],[1,0]],color:"#ef4444"},
  {name:"v3",cells:[[0,0],[1,0],[2,0]],color:"#3b82f6"},
  {name:"v4",cells:[[0,0],[1,0],[2,0],[3,0]],color:"#8b5cf6"},
  {name:"v5",cells:[[0,0],[1,0],[2,0],[3,0],[4,0]],color:"#ec4899"},
  {name:"sq2",cells:[[0,0],[0,1],[1,0],[1,1]],color:"#f97316"},
  {name:"sq3",cells:[[0,0],[0,1],[0,2],[1,0],[1,1],[1,2],[2,0],[2,1],[2,2]],color:"#14b8a6"},
  {name:"L1",cells:[[0,0],[1,0],[1,1]],color:"#22c55e"},
  {name:"L2",cells:[[0,0],[0,1],[1,0]],color:"#22c55e"},
  {name:"L3",cells:[[0,0],[0,1],[1,1]],color:"#06b6d4"},
  {name:"L4",cells:[[0,1],[1,0],[1,1]],color:"#06b6d4"},
  {name:"bigL1",cells:[[0,0],[1,0],[2,0],[2,1],[2,2]],color:"#a855f7"},
  {name:"bigL2",cells:[[0,0],[0,1],[0,2],[1,0],[2,0]],color:"#a855f7"},
  {name:"bigL3",cells:[[0,0],[0,1],[0,2],[1,2],[2,2]],color:"#e879f9"},
  {name:"bigL4",cells:[[0,2],[1,2],[2,0],[2,1],[2,2]],color:"#e879f9"},
  {name:"T1",cells:[[0,0],[0,1],[0,2],[1,1]],color:"#f43f5e"},
  {name:"T2",cells:[[0,0],[1,0],[1,1],[2,0]],color:"#f43f5e"},
  {name:"S1",cells:[[0,1],[0,2],[1,0],[1,1]],color:"#0ea5e9"},
  {name:"S2",cells:[[0,0],[0,1],[1,1],[1,2]],color:"#0ea5e9"},
];

const GS=8, CELL=36, GAP=2;

// ─── State ───
let difficulty="medium", targetScore=500;
let pGrid,aiGrid,pieces,pUsed,aiUsed,selected,pScoreVal,aiScoreVal,pStreak,aiStreak,winner,pStuck,aiStuck,aiIdx,aiTimer;

function emptyGrid(){return Array.from({length:GS},()=>Array(GS).fill(null))}
function randPieces(){return [0,1,2].map(()=>PIECES[Math.floor(Math.random()*PIECES.length)])}

function canPlace(grid,piece,r,c){
  for(const[dr,dc]of piece.cells){const nr=r+dr,nc=c+dc;if(nr<0||nr>=GS||nc<0||nc>=GS||grid[nr][nc])return false}return true
}
function placePiece(grid,piece,r,c){
  const ng=grid.map(row=>[...row]);
  for(const[dr,dc]of piece.cells)ng[r+dr][c+dc]=piece.color;
  return ng
}
function clearLines(grid){
  const rowF=[],colF=[];
  for(let r=0;r<GS;r++)if(grid[r].every(c=>c))rowF.push(r);
  for(let c=0;c<GS;c++){let ok=true;for(let r=0;r<GS;r++)if(!grid[r][c]){ok=false;break}if(ok)colF.push(c)}
  const cleared=rowF.length+colF.length;
  if(!cleared)return{grid,cleared:0};
  const ng=grid.map(row=>[...row]),cs=new Set();
  for(const r of rowF)for(let c=0;c<GS;c++)cs.add(`${r},${c}`);
  for(const c of colF)for(let r=0;r<GS;r++)cs.add(`${r},${c}`);
  for(const k of cs){const[r,c]=k.split(",").map(Number);ng[r][c]=null}
  return{grid:ng,cleared}
}
function canPlaceAny(grid,pcs){
  for(const p of pcs){if(!p)continue;for(let r=0;r<GS;r++)for(let c=0;c<GS;c++)if(canPlace(grid,p,r,c))return true}return false
}
function calcScore(cells,lines,streak){
  let pts=cells;
  if(lines>0){pts+=lines*10;if(lines>=2)pts+=(lines-1)*15;pts+=streak*5}
  return pts
}

// ─── AI ───
function evalBoard(grid){
  let score=0;
  for(let r=0;r<GS;r++)for(let c=0;c<GS;c++){
    if(!grid[r][c]){if(r>0&&!grid[r-1][c])score+=.5;if(c>0&&!grid[r][c-1])score+=.5}
  }
  for(let r=0;r<GS;r++){const f=grid[r].filter(c=>c).length;if(f>=6)score+=(f-5)*3}
  for(let c=0;c<GS;c++){let f=0;for(let r=0;r<GS;r++)if(grid[r][c])f++;if(f>=6)score+=(f-5)*3}
  return score
}
function aiBestMove(grid,piece,diff){
  const pls=[];
  for(let r=0;r<GS;r++)for(let c=0;c<GS;c++)if(canPlace(grid,piece,r,c))pls.push({r,c});
  if(!pls.length)return null;
  if(diff==="easy"&&Math.random()<.6)return pls[Math.floor(Math.random()*pls.length)];
  let best=null,bs=-Infinity;
  for(const pl of pls){
    const ap=placePiece(grid,piece,pl.r,pl.c);
    const{grid:ac,cleared}=clearLines(ap);
    let s=calcScore(piece.cells.length,cleared,0)+evalBoard(ac)+cleared*20;
    if(diff==="easy")s+=Math.random()*15;
    else if(diff==="medium")s+=Math.random()*5;
    else s+=Math.random();
    if(s>bs){bs=s;best=pl}
  }
  return best
}

// ─── Menu ───
const diffs=[{id:"easy",label:"🟢 Easy"},{id:"medium",label:"🟡 Medium"},{id:"hard",label:"🔴 Hard"}];
const targets=[300,500,1000,2000];

function buildMenu(){
  const dr=document.getElementById("diff-row");
  dr.innerHTML="";
  diffs.forEach(d=>{
    const b=document.createElement("button");
    b.className="opt-btn"+(difficulty===d.id?" sel":"");
    b.textContent=d.label;
    b.onclick=()=>{difficulty=d.id;buildMenu()};
    dr.appendChild(b)
  });
  const tr=document.getElementById("target-row");
  tr.innerHTML="";
  targets.forEach(t=>{
    const b=document.createElement("button");
    b.className="opt-btn"+(targetScore===t?" sel-y":"");
    b.textContent=t;
    b.onclick=()=>{targetScore=t;buildMenu()};
    tr.appendChild(b)
  })
}

// ─── Grid Rendering ───
function buildGrid(el,id){
  el.innerHTML="";
  el.style.gridTemplateRows=`repeat(${GS},${CELL}px)`;
  el.style.gridTemplateColumns=`repeat(${GS},${CELL}px)`;
  el.style.gap=GAP+"px";
  for(let r=0;r<GS;r++)for(let c=0;c<GS;c++){
    const d=document.createElement("div");
    d.className="grid-cell";
    d.style.width=CELL+"px";d.style.height=CELL+"px";
    d.dataset.r=r;d.dataset.c=c;d.dataset.grid=id;
    el.appendChild(d)
  }
}

function renderGrid(el,grid){
  const cells=el.querySelectorAll(".grid-cell");
  cells.forEach(cell=>{
    const r=+cell.dataset.r,c=+cell.dataset.c,v=grid[r][c];
    cell.className="grid-cell"+(v?" filled":"");
    cell.style.background=v||"";
    cell.style.borderColor=v?"rgba(0,0,0,.2)":"";
    cell.style.boxShadow=v?`inset 0 -2px 0 rgba(0,0,0,.3),0 0 4px ${v}30`:"";
  })
}

function clearGhost(){
  document.querySelectorAll(".ghost-ok,.ghost-bad").forEach(c=>{c.classList.remove("ghost-ok","ghost-bad")})
}

// ─── Piece Tray ───
function renderTray(){
  const tray=document.getElementById("tray");
  tray.innerHTML='<span class="tray-label">Pieces</span>';
  pieces.forEach((piece,i)=>{
    const box=document.createElement("div");
    if(pUsed[i]){box.className="piece-box used";tray.appendChild(box);return}
    box.className="piece-box"+(selected===i?" sel":"")+(winner||pStuck?" disabled":"");
    box.onclick=()=>{if(winner||pUsed[i]||pStuck)return;selected=selected===i?null:i;renderTray();updateHint()};

    const maxR=Math.max(...piece.cells.map(c=>c[0]))+1;
    const maxC=Math.max(...piece.cells.map(c=>c[1]))+1;
    const g=document.createElement("div");
    g.className="piece-grid";
    g.style.gridTemplateRows=`repeat(${maxR},12px)`;
    g.style.gridTemplateColumns=`repeat(${maxC},12px)`;
    for(let r=0;r<maxR;r++)for(let c=0;c<maxC;c++){
      const d=document.createElement("div");
      d.className="piece-cell";d.style.width="12px";d.style.height="12px";
      const filled=piece.cells.some(([pr,pc])=>pr===r&&pc===c);
      d.style.background=filled?piece.color:"transparent";
      d.style.boxShadow=filled?`inset 0 -2px 0 rgba(0,0,0,.3),0 0 6px ${piece.color}40`:"";
      g.appendChild(d)
    }
    box.appendChild(g);
    tray.appendChild(box)
  });
  if(pStreak>0&&!winner){
    const s=document.createElement("span");
    s.className="streak";s.textContent="🔥 ×"+pStreak;
    tray.appendChild(s)
  }
}

function updateHint(){
  const h=document.getElementById("hint");
  if(winner){h.textContent="";return}
  if(selected!==null){h.className="hint active";h.textContent="Click on your grid to place the piece"}
  else{h.className="hint";h.textContent="Select a piece below, then click your grid to place it"}
}

function updateScores(){
  document.getElementById("p-score").textContent=pScoreVal;
  document.getElementById("ai-score").textContent=aiScoreVal;
  document.getElementById("p-target").textContent="/ "+targetScore;
  document.getElementById("ai-target").textContent="/ "+targetScore;
  const pp=Math.min(100,pScoreVal/targetScore*100);
  const ap=Math.min(100,aiScoreVal/targetScore*100);
  document.getElementById("p-prog").style.width=pp+"%";
  document.getElementById("ai-prog").style.width=ap+"%";
  document.getElementById("p-prog-bar").style.width=(GS*(CELL+GAP))+"px";
  document.getElementById("ai-prog-bar").style.width=(GS*(CELL+GAP))+"px";

  const pg=document.getElementById("p-grid");
  const ag=document.getElementById("ai-grid");
  pg.className="grid"+((!winner&&!pStuck)?" active-p":"");
  ag.className="grid"+((!winner&&!aiStuck)?" active-ai":"");

  document.getElementById("p-stuck").style.display=pStuck&&!winner?"block":"none";
  document.getElementById("ai-stuck").style.display=aiStuck&&!winner?"block":"none";
}

function showWinner(){
  const b=document.getElementById("winner-banner");
  if(!winner){b.style.display="none";return}
  const w=winner==="player";
  b.className="banner "+(w?"win":"lose");
  b.style.display="flex";
  b.innerHTML=`<span>${w?"🎉 You win!":"😞 AI wins!"}</span><button onclick="resetGame()">Rematch</button>`;
}

// ─── Player interaction ───
function onPlayerGridMove(e){
  clearGhost();
  if(selected===null||winner||pStuck)return;
  const cell=e.target.closest("[data-grid='p']");
  if(!cell)return;
  const r=+cell.dataset.r,c=+cell.dataset.c,piece=pieces[selected];
  if(!piece)return;
  const valid=canPlace(pGrid,piece,r,c);
  for(const[dr,dc]of piece.cells){
    const nr=r+dr,nc=c+dc;
    if(nr>=0&&nr<GS&&nc>=0&&nc<GS){
      const target=document.querySelector(`[data-grid='p'][data-r='${nr}'][data-c='${nc}']`);
      if(target)target.classList.add(valid?"ghost-ok":"ghost-bad")
    }
  }
}

function onPlayerGridLeave(){clearGhost()}

function onPlayerGridClick(e){
  if(selected===null||winner||pStuck)return;
  const cell=e.target.closest("[data-grid='p']");
  if(!cell)return;
  const r=+cell.dataset.r,c=+cell.dataset.c,piece=pieces[selected];
  if(!piece||!canPlace(pGrid,piece,r,c))return;

  const after=placePiece(pGrid,piece,r,c);
  const{grid:cleared,cleared:lines}=clearLines(after);
  const ns=lines>0?pStreak+1:0;
  const pts=calcScore(piece.cells.length,lines,ns);

  pGrid=cleared;pScoreVal+=pts;pStreak=ns;
  pUsed[selected]=true;selected=null;

  renderGrid(document.getElementById("p-grid"),pGrid);
  renderTray();updateScores();updateHint();clearGhost();

  if(pts>5){
    const col=document.getElementById("player-col");
    col.style.animation="scorePop .3s ease";
    setTimeout(()=>col.style.animation="",300)
  }

  checkWinCondition();
  checkStuck();
  checkAllUsed();
}

// ─── AI Turn ───
function runAiTurn(){
  if(winner||aiStuck||aiIdx>=3||aiUsed[aiIdx])return;
  const piece=pieces[aiIdx];
  if(!piece){aiUsed[aiIdx]=true;aiIdx++;scheduleAi();return}

  const move=aiBestMove(aiGrid,piece,difficulty);
  if(!move){
    aiUsed[aiIdx]=true;aiIdx++;
    checkStuck();checkAllUsed();scheduleAi();
    return
  }

  const after=placePiece(aiGrid,piece,move.r,move.c);
  const{grid:cleared,cleared:lines}=clearLines(after);
  const ns=lines>0?aiStreak+1:0;
  const pts=calcScore(piece.cells.length,lines,ns);

  aiGrid=cleared;aiScoreVal+=pts;aiStreak=ns;
  aiUsed[aiIdx]=true;aiIdx++;

  renderGrid(document.getElementById("ai-grid"),aiGrid);
  updateScores();

  if(pts>5){
    const col=document.getElementById("ai-col");
    col.style.animation="scorePop .3s ease";
    setTimeout(()=>col.style.animation="",300)
  }

  checkWinCondition();
  checkStuck();
  checkAllUsed();
  if(!winner)scheduleAi()
}

function scheduleAi(){
  if(winner||aiIdx>=3||aiUsed.every(Boolean))return;
  const delay=difficulty==="hard"?600:difficulty==="medium"?400:300;
  aiTimer=setTimeout(runAiTurn,delay)
}

// ─── Game flow ───
function checkWinCondition(){
  if(winner)return;
  if(pScoreVal>=targetScore){winner="player";showWinner()}
  else if(aiScoreVal>=targetScore){winner="ai";showWinner()}
}

function checkStuck(){
  if(winner)return;
  const remP=pieces.filter((_,i)=>!pUsed[i]);
  if(remP.length>0&&!canPlaceAny(pGrid,remP))pStuck=true;
  const remA=pieces.filter((_,i)=>!aiUsed[i]);
  if(remA.length>0&&!canPlaceAny(aiGrid,remA))aiStuck=true;
  updateScores();renderTray();

  if(pStuck&&aiStuck&&!winner){
    setTimeout(dealNewPieces,600)
  }
}

function checkAllUsed(){
  if(winner)return;
  if(pUsed.every(Boolean)&&aiUsed.every(Boolean)){
    setTimeout(dealNewPieces,300)
  }
}

function dealNewPieces(){
  if(winner)return;
  pieces=randPieces();
  pUsed=[false,false,false];
  aiUsed=[false,false,false];
  selected=null;aiIdx=0;
  pStuck=false;aiStuck=false;
  renderTray();updateScores();updateHint();
  scheduleAi()
}

// ─── Init / Reset ───
function initGame(){
  pGrid=emptyGrid();aiGrid=emptyGrid();
  pieces=randPieces();
  pUsed=[false,false,false];aiUsed=[false,false,false];
  selected=null;pScoreVal=0;aiScoreVal=0;pStreak=0;aiStreak=0;
  winner=null;pStuck=false;aiStuck=false;aiIdx=0;
  clearTimeout(aiTimer);

  const pg=document.getElementById("p-grid");
  const ag=document.getElementById("ai-grid");
  buildGrid(pg,"p");buildGrid(ag,"ai");
  renderGrid(pg,pGrid);renderGrid(ag,aiGrid);
  renderTray();updateScores();updateHint();showWinner();

  document.getElementById("game-tag").textContent=
    `vs AI · ${difficulty==="easy"?"Easy":difficulty==="medium"?"Medium":"Hard"} · Race to ${targetScore}`;

  // Events
  pg.onmousemove=onPlayerGridMove;
  pg.onmouseleave=onPlayerGridLeave;
  pg.onclick=onPlayerGridClick;

  scheduleAi()
}

function startGame(){
  document.getElementById("menu").style.display="none";
  document.getElementById("game").classList.add("active");
  initGame()
}

function resetGame(){
  clearTimeout(aiTimer);
  initGame()
}

function backToMenu(){
  clearTimeout(aiTimer);
  document.getElementById("game").classList.remove("active");
  document.getElementById("menu").style.display="flex";
  buildMenu()
}

// Boot
buildMenu()
</script>
</body>
</html>
